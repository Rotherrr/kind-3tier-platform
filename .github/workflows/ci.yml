name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Validate manifests
        run: kubectl kustomize k8s/ | kubeconform -strict -ignore-missing-schemas -summary
      - name: Shellcheck
        run: shellcheck scripts/*.sh
      - name: Hadolint (backend)
        uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: app/backend/Dockerfile }
      - name: Hadolint (frontend)
        uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: app/frontend/Dockerfile }

  e2e:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Full environment + smoke test
        run: make up
      - name: Dump state on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl -n three-tier describe pods | tail -100
