name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Validate manifests
        run: kubectl kustomize k8s/ | kubeconform -strict -ignore-missing-schemas -summary
      - name: Shellcheck
        run: shellcheck scripts/*.sh
      - name: Hadolint (backend)
        uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: app/backend/Dockerfile }
      - name: Hadolint (frontend)
        uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: app/frontend/Dockerfile }

  e2e:
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Full environment + smoke test
        run: make up
      - name: Dump state on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n three-tier get events --sort-by=.lastTimestamp | tail -40 || true
          kubectl -n three-tier describe pods | tail -150 || true
          kubectl -n three-tier logs deploy/backend --all-containers --tail=80 || true
          kubectl -n three-tier logs sts/mongodb --tail=40 || true
