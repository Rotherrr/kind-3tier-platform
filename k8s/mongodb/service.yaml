apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: three-tier
  labels: { app.kubernetes.io/name: mongodb, app.kubernetes.io/part-of: three-tier-platform }
spec:
  clusterIP: None            # headless: stable DNS for the StatefulSet
  selector: { app.kubernetes.io/name: mongodb }
  ports:
    - name: mongo
      port: 27017
      targetPort: mongo
